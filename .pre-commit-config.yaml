repos:
  - repo: local
    hooks:
      - id: no-signing-keys
        name: no signing keys staged
        language: system
        pass_filenames: false
        entry: bash scripts/check-no-keys.sh

      - id: file-length-check
        name: file length <= 300 lines (RULES.md 2.2)
        language: system
        pass_filenames: true
        files: \.mc$
        entry: bash scripts/check-file-length.sh

      - id: monkeyc-typecheck
        name: monkeyc strict type check
        language: system
        pass_filenames: false
        files: \.(mc|jungle|xml)$
        entry: make lint

      - id: monkeyc-test
        name: monkeyc unit tests
        language: system
        pass_filenames: false
        files: \.mc$
        entry: make test

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-xml
      - id: check-yaml
